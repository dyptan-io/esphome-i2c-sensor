name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp8266
          - esp32
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build firmware
        uses: esphome/build-action@v7.3.0
        with:
          yaml-file: tests/${{ matrix.target }}.yaml
