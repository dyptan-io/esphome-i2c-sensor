esphome:
  name: chirp-test-esp32

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [chirp]

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: chirp
    address: 0x20
    update_interval: 5s
    moisture:
      name: "Soil Moisture"
      calibration:
        min_capacity: 300
        max_capacity: 600
    temperature:
      name: "Soil Temperature"
    illuminance:
      name: "Ambient Light"
      calibration:
        coefficient: -1.525
        constant: 100000
